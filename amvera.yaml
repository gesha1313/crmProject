# Amvera: сборка и запуск Django CRM
builder: python
pythonVersion: "3.12"
command: pip install -r requirements.txt
runCommand: sh -c "cd crm && python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py shell -c \"from django.contrib.auth.models import User; User.objects.filter(username='admin').exists() or User.objects.create_superuser('admin', 'admin@patronage.ru', 'Admin123!')\" && gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-8000}"
